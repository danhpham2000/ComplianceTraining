[project]
name = "compliance-training-api"
version = "0.1.0"
description = "FastAPI backend for the AI-native compliance training platform"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.4",
  "fastapi>=0.116.1",
  "httpx>=0.28.1",
  "openai>=2.5.0",
  "pillow>=11.3.0",
  "psycopg[binary]>=3.2.9",
  "pydantic-settings>=2.10.1",
  "python-dotenv>=1.1.1",
  "sqlalchemy>=2.0.43",
  "uvicorn[standard]>=0.35.0"
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["app/tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
